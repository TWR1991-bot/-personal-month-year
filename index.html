.bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:16px 0 4px;align-items:center}
button{font:inherit;font-size:13px;border:1px solid var(--ink);background:none;color:var(--ink);padding:3px 14px;border-radius:2px;cursor:pointer;letter-spacing:.1em}

.tabs button{border:none;border-bottom:2px solid transparent;padding:6px 14px;color:var(--mute)}
.tabs button.on{color:var(--ink);border-color:var(--clay);background:none}
section{background:var(--card);border:1px solid var(--line);padding:20px 22px;margin-bottom:24px;box-shadow:3px 3px 0 var(--sand)}
h2{font-weight:600;font-size:16px;letter-spacing:.3em;margin:0 0 12px;color:var(--clay)}
h2 small{color:var(--mute);font-weight:400;letter-spacing:.05em;margin-left:8px;font-size:12px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-weight:400;color:var(--mute);text-align:left;border-bottom:1px solid var(--ink);padding:5px 8px;white-space:nowrap;font-size:13px}
td{padding:5px 8px;border-bottom:1px dashed var(--line);vertical-align:middle}
.r{text-align:right;font-variant-numeric:tabular-nums}
tr.tot td{border-top:1px solid var(--ink);border-bottom:none;font-weight:600}
input,select{font:inherit;font-size:14px;width:100%;min-width:70px;border:none;border-bottom:1px solid var(--sage);background:#fff8;padding:2px 4px;color:var(--ink)}

.note{color:var(--mute);font-size:12px;white-space:pre-line}
.bar2{height:6px;background:var(--sand);min-width:80px}.bar2 i{display:block;height:100%;background:var(--sage)}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.chips span{border:1px solid var(--line);padding:2px 12px;font-size:13px}
.msg{text-align:center;color:var(--mute);font-size:13px;min-height:20px}
#msg{color:var(--mute);font-size:12px;align-self:center;max-width:52vw;text-align:right;line-height:1.3;background:var(--bg);padding:0 4px}
.ic{vertical-align:-3px;margin-right:6px;flex:none}
.add{margin-top:10px}
dialog{border:1px solid var(--ink);background:var(--card);color:var(--ink);padding:22px;font-family:inherit}
dialog::backdrop{background:#3d3a3566}
</style>

      if(c.f)return `<td class="r">${c.f(r,i)}</td>`;
      const v=r[c.k],a=`data-t="${key}" data-i="${i}" data-k="${c.k}"`;
      if(!editing||c.ro)return c.t==='num'?`<td class="r">${v===''?'':fmt(v)}</td>`:`<td class="${c.k==='備註'?'note':''}">${esc(v)}</td>`;
      if(c.t==='num')return `<td><input type="number" step="any" value="${esc(v)}" ${a}></td>`;
      if(c.t==='sel'){let o=c.o();if(v&&!o.includes(v))o=[v,...o];return `<td><select ${a}><option value=""></option>${o.map(x=>`<option${x===v?' selected':''}>${esc(x)}</option>`).join('')}</select></td>`}
      return `<td><input value="${esc(v)}" ${a}></td>`;
    }).join('')+(editing?`<td><button class="x" data-del="${key}:${i}">✕</button></td>`:'')+'</tr>';
  });
  h+=foot+'</table></div>';
  if(editing)h+=`<button class="add" data-add="${key}">＋ 新增一列</button>`;
  return h;
}
const IC={house:'M3 11l9-7 9 7M5 10v10h14V10M10 20v-6h4v6',shield:'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM9 12l2 2 4-4',cup:'M5 8h12v6a5 5 0 0 1-5 5h-2a5 5 0 0 1-5-5zM17 10h2a2 2 0 0 1 0 4h-2M8 3v2M12 3v2',music:'M9 18V6l10-2v12M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0zM19 16a3 3 0 1 1-6 0 3 3 0 0 1 6 0z',book:'M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 19V5M8 7h7',heart:'M12 20s-8-5-8-11a4.5 4.5 0 0 1 8-2.5A4.5 4.5 0 0 1 20 9c0 6-8 11-8 11z',coin:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM9 10h6M9 14h6',leaf:'M5 19c0-9 5-14 14-14 0 9-5 14-14 14zM5 19l8-8',bank:'M3 9l9-5 9 5zM5 9v8M9 9v8M15 9v8M19 9v8M3 20h18'};
const icn=(k,s=18)=>`<svg class="ic" viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="${IC[k]||IC.leaf}"/></svg>`;
const catIcon=n=>n.includes('貸款')?'house':n.includes('保')?'shield':n.includes('生活')?'cup':n.includes('娛樂')?'music':n.includes('學習')?'book':n.includes('孝親')?'heart':n.includes('儲蓄')?'coin':'leaf';
const S=(t,body,sub='',ic='leaf')=>`<section><h2>${icn(ic)}${t}<small>${sub}</small></h2>${body}</section>`;
const tot=(cells)=>'<tr class="tot">'+cells.map((c,i)=>`<td class="${i?'r':''}">${c}</td>`).join('')+'</tr>';

function pie(items,total){
  if(!total)return '';
  let a=-Math.PI/2,h='',ic='';
  items.forEach((x,i)=>{
    if(x.v<=0)return;const col=PAL[i%PAL.length],f=x.v/total,m=a+f*Math.PI;
    if(f>=.9999){h+=`<circle cx="100" cy="100" r="92" fill="${col}"/>`}
    else{
      const b=a+f*2*Math.PI,[x1,y1]=[100+92*Math.cos(a),100+92*Math.sin(a)],[x2,y2]=[100+92*Math.cos(b),100+92*Math.sin(b)];
      h+=`<path d="M100 100L${x1} ${y1}A92 92 0 ${f>.5?1:0} 1 ${x2} ${y2}Z" fill="${col}" stroke="#fbf8f2" stroke-width="2"><title>${esc(x.n)} ${pct(f)}</title></path>`;a=b;
    }
    const cx=100+112*Math.cos(m),cy=100+112*Math.sin(m);   // 圓餅外圍的類別圖示
    ic+=`<g transform="translate(${cx-11} ${cy-11}) scale(.917)" fill="none" stroke="#3d3a35" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="13" fill="#fbf8f2" stroke="${col}" stroke-width="1.5"/><path d="${IC[catIcon(x.n)]||IC.leaf}"/></g>`;
  });
  return `<svg viewBox="-36 -36 272 272" width="280" height="280" style="max-width:100%;height:auto">${h}<circle cx="100" cy="100" r="50" fill="#fbf8f2"/><text x="100" y="96" text-anchor="middle" font-size="10" fill="#8a8378">總開銷(年)</text><text x="100" y="115" text-anchor="middle" font-size="15" fill="#3d3a35">${fmt(total)}</text>${ic}</svg>`;
}
// 來源可加編號（季獎金1、季獎金2…），一律歸入開頭相符的來源（季獎金）
const srcOf=r=>{const v=String(r.來源??'').trim();return srcs().filter(s=>v.startsWith(s)).sort((a,b)=>b.length-a.length)[0]||v};
const salIdx=()=>{const i=D.income.findIndex(r=>r.項目==='薪水');return i<0?0:i};
const mapExp=(r,i)=>i===salIdx()?sum(D.expense,eY):srcs().includes(r.項目)?sum(D.bonus.filter(x=>srcOf(x)===r.項目),x=>x.年額):0;
const pages=[
()=>{ // 第一頁
  const mb=v=>fmt(v)+`<div class="note" style="font-weight:400">（月平均金額：${fmt(v/12)}）</div>`;
  const Y=sum(D.income,incY),E=D.income.reduce((s,r,i)=>s+mapExp(r,i),0);
  const inc=tbl('income',[{k:'項目',t:'text'},{k:'金額',t:'num'},{k:'倍數',l:'每年次數',t:'num'},{l:'年收入',f:r=>fmt(incY(r))},{l:'總支出',f:(r,i)=>fmt(mapExp(r,i))},{l:'餘額',f:(r,i)=>mb(incY(r)-mapExp(r,i))}],tot(['合計','','',fmt(Y),fmt(E),mb(Y-E)]));
  const items=D.categories.map(c=>({n:c.類別,v:catY(c.類別)})),total=sum(items,x=>x.v);
  const lg=items.map((x,i)=>`<div><span style="color:${PAL[i%PAL.length]}">${icn(catIcon(x.n),20)}</span>${esc(x.n)}<u>${fmt(x.v/12)}</u><b>${fmt(x.v)}</b><em>${total?pct(x.v/total):'-'}</em></div>`).join('')+`<div style="border:none;font-weight:600"><span style="width:20px"></span>合計<u style="color:inherit">${fmt(total/12)}</u><b>${fmt(total)}</b><em>${total?'100%':''}</em></div>`;
  return S('收入與支出',inc,'薪水對應月支出，季獎金／年終對應獎金分配','coin')+S('各類別占比',`<div class="pie">${pie(items,total)}<div class="lg"><div style="color:var(--mute);font-size:12px"><span style="width:20px"></span>類別<u>月平均</u><b>年支出</b><em>占比</em></div>${lg}</div></div>`,'含支出與獎金分配','leaf');
},
()=>{ // 第二頁
  const rows=D.banks.map((b,i)=>{const yr=sum(D.expense.filter(r=>r.銀行===b.銀行),eY);return `<tr><td>${icn('bank',15)}${esc(b.銀行)}</td><td class="r">${fmt(yr)}</td><td class="r">${fmt(yr/12)}</td><td class="${editing?'':'r'}">${editing?`<input type="number" value="${esc(b.每月領出)}" data-t="banks" data-i="${i}" data-k="每月領出">`:fmt(b.每月領出)}</td></tr>`}).join('');
  const bk=`<div class="tw"><table><tr><th>銀行</th><th class="r">年額</th><th class="r">月額</th><th class="r">每月領出</th></tr>${rows}${tot(['加總',fmt(sum(D.expense,eY)),fmt(sum(D.expense,eY)/12),fmt(sum(D.banks,r=>r.每月領出))])}</table></div>`;
  const pay=n(D.income[salIdx()]&&D.income[salIdx()].金額),dk=sum(D.expense.filter(r=>r.銀行==='合作金庫'),r=>r.月支出===''?n(r.年支出)/12:r.月支出);
  const lim=`<div style="text-align:right;margin-top:10px">每月領取上限：月薪 ${fmt(pay)} − 扣款 ${fmt(dk)} = <b>${fmt(pay-dk)}</b><div class="note">扣款＝每月從合作金庫支出的合計</div></div>`;
  const ss=srcs(),r2=banks().map(b=>({b,v:ss.map(s=>sum(D.bonus.filter(r=>r.銀行===b&&srcOf(r)===s),r=>r.年額))})).filter(x=>x.v.some(Boolean));
  const cs=ss.map((s,j)=>sum(r2,x=>x.v[j]));
  const bb=`<div class="tw"><table><tr><th>銀行</th>${ss.map(s=>`<th class="r">${esc(s)}</th>`).join('')}<th class="r">合計</th></tr>${r2.map(x=>`<tr><td>${icn('bank',15)}${esc(x.b)}</td>${x.v.map(v=>`<td class="r">${v?fmt(v):''}</td>`).join('')}<td class="r">${fmt(x.v.reduce((a,b)=>a+b,0))}</td></tr>`).join('')}${tot(['加總',...cs.map(fmt),fmt(sum(cs,x=>x))])}</table></div>`;
  return S('各銀行扣款與每月領出',bk+lim,'年額 ÷ 12 為月額','bank')+S('獎金入帳（依銀行）',bb,'獎金分配進各銀行的金額','coin');
},
()=>{ // 第三頁
  const st=`<div class="tabs sub">${['月支出','獎金分配'].map((x,i)=>`<button class="${i===sub?'on':''}" data-s="${i}">${x}</button>`).join('')}</div>`;
  if(sub===0){
    const avg=sum(D.expense,eY)/12,pay=n(D.income[salIdx()]&&D.income[salIdx()].金額),bal=pay-avg;
    const foot=tot(['','平均月支出',fmt(avg),'月餘額　'+fmt(bal),'年餘額　'+fmt(bal*12)]);
    return st+S('月支出',tbl('expense',[{k:'類別',t:'sel',o:cats},{k:'項目',t:'text'},{k:'月支出',t:'num'},{k:'年支出',t:'num'},{k:'銀行',l:'銀行／備註',t:'sel',o:banks}],foot),'修改月支出會自動換算年支出；月餘額＝月薪 − 平均月支出，年餘額＝月餘額 × 12');
  }
  const chips=srcs().map(s=>`<span>${esc(s)}　${fmt(sum(D.bonus.filter(r=>srcOf(r)===s),r=>r.年額))}</span>`).join('');
  const al=sum(D.bonus,r=>r.年額),bi=sum(D.income.filter(r=>srcs().includes(r.項目)),incY);
  const foot=tot(['加總','',fmt(al),'獎金收入　'+fmt(bi),'年餘額　'+fmt(bi-al)]);
  return st+S('獎金分配',`<div class="chips">${chips}</div>`+tbl('bonus',[{k:'類別',t:'sel',o:cats},{k:'項目',t:'text'},{k:'年額',t:'num'},{k:'來源',t:'sel',o:srcs},{k:'銀行',t:'sel',o:banks}],foot),'依來源小計；各銀行入帳請見「銀行」頁籤','coin');
},
()=>{ // 第四頁
  const m=k=>fmt(sum(D[k],r=>n(r.單價)*n(r.次數))/12);
  const yc={l:'支出(年)',f:r=>fmt(n(r.單價)*n(r.次數))};
  return S('生活用品',tbl('supplies',[{k:'項目',t:'text'},{k:'單價',t:'num'},{k:'次數',l:'年次數',t:'num'},yc],tot(['加總 ÷ 12 ＝ 月均','','',m('supplies')])))
   +S('機車保養',tbl('moto',[{k:'項目',t:'text'},{k:'單價',t:'num'},{k:'次數',l:'年次數',t:'num'},yc,{k:'備註',t:'text'}],tot(['加總 ÷ 12 ＝ 月均','','',m('moto'),''])));
},
()=>{ // 勞退 · 老年給付
  const gs=[...new Set(D.pension.map(r=>r.區塊))];
  return gs.map((g,gi)=>{
    const rs=D.pension.filter(r=>r.區塊===g),d=rs.find(r=>r.項目==='試算日期');
    const body=rs.filter(r=>r!==d).map(r=>{
      const s=String(r.數值??'').trim(),v=r.單位&&/^[\d,]+(\.\d+)?$/.test(s)?fmt(s.replace(/,/g,'')):esc(s);
      return `<div class="kv"><span>${esc(r.項目)}</span><b>${v}${r.單位?`<small>${esc(r.單位)}</small>`:''}</b>${r.備註?`<span class="note">${esc(r.備註)}</span>`:''}</div>`}).join('');
    return S(esc(g),body+(g.includes('勞退')?'<div class="tip">※ 勞退個人專戶已包含老年給付</div>':''),d?'試算日期 '+esc(d.數值):'',gi?'bank':'coin');
  }).join('');
},
()=>{ // 退休金試算
  const Y=sum(D.rincome,r=>n(r.月收入)*n(r.倍數)),E=sum(D.rexpense,eY),bal=Y/12-E/12,fd=D.rincome.find(r=>r.項目==='定存');
  const inc=tbl('rincome',[{k:'項目',t:'text'},{k:'月收入',t:'num'},{k:'倍數',l:'年收入倍數',t:'num'},{l:'年收入',f:r=>fmt(n(r.月收入)*n(r.倍數))},{k:'備註',t:'text'}],tot(['年收入','','',fmt(Y),''])+tot(['平均月收入','','',fmt(Y/12),''])+(fd?tot(['35歲開始月存','','',fmt(fd.月收入),'']):''));
  const exp=tbl('rexpense',[{k:'大類別',t:'text'},{k:'類別',t:'text'},{k:'項目',t:'text'},{k:'月支出',t:'num'},{k:'年支出',t:'num'}],tot(['年開銷 ／ 平均月支出','','',fmt(E/12),fmt(E)])+tot(['餘額（平均月收入 − 平均月支出）','','',fmt(bal),fmt(bal*12)]));
  const items=[...new Set(D.rexpense.map(r=>r.大類別))].map(c=>({n:c,v:sum(D.rexpense.filter(r=>r.大類別===c),eY)})),total=sum(items,x=>x.v);
  const lg=items.map((x,i)=>`<div><span style="color:${PAL[i%PAL.length]}">${icn(catIcon(x.n),20)}</span>${esc(x.n)}<u>${fmt(x.v/12)}</u><b>${fmt(x.v)}</b><em>${total?pct(x.v/total):'-'}</em></div>`).join('');
  const lv=tbl('rtable',[{k:'月薪',l:'投保月薪',t:'num'},{l:'每月需自存',f:r=>n(r.每月需自存)?fmt(r.每月需自存):'無需自存'}]);
  const gl=D.rgoal,g0=gl[0]||{},ex=gl.find(r=>n(r.退休年齡)===65)||gl[gl.length-1]||{},tg=r=>(n(r.預計壽命)-n(r.退休年齡))*12*(n(r.月支出)-n(r.勞退月領));
  const gr=gl.map(r=>`<tr><td>${icn('leaf',15)}${esc(r.退休年齡)} 歲退休</td><td class="r">${n(r.勞退月領)?fmt(r.勞退月領):'-'}</td><td class="r"><b>${fmt(tg(r))}</b></td></tr>`).join('');
  const goal=`<div class="tw"><table><tr><th>退休年齡</th><th class="r">勞退月領（保守估計）</th><th class="r">目標存款</th></tr>${gr}</table></div><div class="note" style="margin-top:10px">計算邏輯：預計活到 ${esc(g0.預計壽命)} 歲，月支出 ${fmt(g0.月支出)} 元。目標存款 ＝（${esc(g0.預計壽命)} − 退休年齡）× 12 × （月支出 − 勞退月領）；勞退月領為保守估計可月領金額。\n例：${esc(ex.退休年齡)} 歲退休，餘年 ${n(ex.預計壽命)-n(ex.退休年齡)}，${n(ex.預計壽命)-n(ex.退休年齡)} × 12 × （${fmt(ex.月支出)} − ${fmt(ex.勞退月領)}） ＝ ${fmt(tg(ex))}，即 ${esc(ex.退休年齡)} 歲前要達到的存款。</div>`;
  const st=`<div class="tabs sub">${['收入','支出'].map((x,i)=>`<button class="${i===sub?'on':''}" data-s="${i}">${x}</button>`).join('')}</div>`;
  return st+(sub===0?S('退休後收入',inc,'月收入 × 倍數 ＝ 年收入','coin')+S('退休收支平衡投保級距與自存對照表',lv,'','shield')+S('退休目標',goal,'','heart'):(S('退休後支出',exp,'餘額：左為每月，右為每年','cup')+S('支出占比',`<div class="pie">${pie(items,total)}<div class="lg"><div style="color:var(--mute);font-size:12px"><span style="width:20px"></span>類別<u>月平均</u><b>年支出</b><em>占比</em></div>${lg}</div></div>`,'依大類別','leaf')));
}
];

function render(){
  const names=editing?[...TABS,'選項管理']:TABS;
  if(page>=names.length)page=0;
  $('#tabs').innerHTML=names.map((t,i)=>`<button class="${i===page?'on':''}" data-p="${i}">${t}</button>`).join('');
  $('#main').innerHTML=D?pages[page]():'<p class="msg">讀取中…</p>';
}
const say=t=>$('#msg').textContent=t;
async function api(body){
  const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
  return r.json();
}
async function load(){
  if(!API_URL){D=JSON.parse(JSON.stringify(SEED));say('示範資料（尚未連接試算表）');render();return}
  try{const r=await fetch(API_URL);D=await r.json();if(D.error)throw new Error(D.error);for(const k in SEED)if(!Array.isArray(D[k])||(['pension','rincome','rexpense','rtable','rgoal'].includes(k)&&!D[k].length))D[k]=JSON.parse(JSON.stringify(SEED[k]));say('');}
  catch(e){console.error(e);D=JSON.parse(JSON.stringify(SEED));say('讀取試算表失敗，顯示示範資料（'+String(e.message).slice(0,60)+'）');}
  render();
}
document.addEventListener('click',async e=>{
  const t=e.target,d=t.dataset;
  if(d.p!==undefined){page=+d.p;sub=0;render()}
  if(d.s!==undefined){sub=+d.s;render()}
  if(d.add){D[d.add].push({...NEW[d.add]});dirty=true;render()}
  if(d.del){const[k,i]=d.del.split(':');if(confirm('刪除這一列？')){D[k].splice(+i,1);dirty=true;render()}}
});
document.addEventListener('change',e=>{
  const d=e.target.dataset;if(!d.t)return;
  const r=D[d.t][+d.i],v=e.target.value;
  r[d.k]=e.target.type==='number'?(v===''?'':+v):v;
  if(d.t==='expense'&&d.k==='月支出'&&v!=='')r.年支出=n(v)*12;
  dirty=true;render();
});
$('#bRef').onclick=()=>{D=null;render();load()};
load();
</script>
